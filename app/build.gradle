plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.example.p942818'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.p942818"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'com.google.android.material:material:1.12.0'

    // Jetpack Compose
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.6'
    implementation 'androidx.compose.foundation:foundation:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
    // 代码里用了 Icons.Filled.* 全量图标 + AutoMirrored.Filled.ArrowBack
    implementation 'androidx.compose.material:material-icons-core:1.6.0'

    // 各 backup/*.kt 用了 kotlinx.coroutines.{launch,delay,Dispatchers,withContext}
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Shizuku 提权（ShizukuHelper.kt 用到 rikka.shizuku.Shizuku）
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.6'
}
